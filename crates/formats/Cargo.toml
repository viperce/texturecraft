[package]
name = "texturecraft-formats"
description = "TextureCraft file formats: mesh import (glTF, FBX, COLLADA, USD, OBJ, PLY, STL), glTF/USD/OBJ mesh export, texture export presets, the .tcraft project file"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
texturecraft-core = { workspace = true }
texturecraft-texel = { workspace = true }
texturecraft-geom = { workspace = true }
texturecraft-compose = { workspace = true }
image = { workspace = true }
gltf = { workspace = true }
tobj = { workspace = true }
flate2 = { workspace = true }
lz4_flex = { workspace = true }
half = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }
exr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
# Reinterpret decoded RGBA f32 samples as pixels without a copy (`try_cast_vec`).
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
base64 = { workspace = true }
